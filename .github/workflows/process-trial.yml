name: Process trial

run-name: process ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Inbox job folder name (inbox/<job_id>/)
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install ezc3d numpy PyYAML pandas

      - name: Run Workstream A writers
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          IN="inbox/${JOB_ID}"
          OUT="data/processed/${JOB_ID}"
          test -f "${IN}/trial.yaml"
          SOURCE="$(find "${IN}" -maxdepth 1 -type f ! -name 'trial.yaml' | head -n 1)"
          test -n "${SOURCE}"
          export PYTHONPATH=src
          python scripts/process_job.py \
            --config "${IN}/trial.yaml" \
            --source "${SOURCE}" \
            --out-dir "${OUT}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: gait-outputs-${{ inputs.job_id }}
          path: data/processed/${{ inputs.job_id }}/
