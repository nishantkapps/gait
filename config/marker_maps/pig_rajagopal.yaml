# Plug-in Gait (Vicon) → Rajagopal walk MarkerSet
# Source labels may be "Subject:LASI" or "LASI"; the mapper strips the prefix.
# Set drop_unmapped: true so PiG virtual/angle points are not written to TRC.

drop_unmapped: true

markers:
  # Pelvis
  LASI: L.ASIS
  RASI: R.ASIS
  LPSI: L.PSIS
  RPSI: R.PSIS
  # SACR often absent in modern PiG; S2 is synthesized below from mid-PSIS.

  # Thorax / shoulders
  # CLAV → MidClavicle. Do NOT map LCLA/RCLA → L/R.Clavicle: PiG clavicle
  # markers sit near the acromial end (~25–30 cm from CLAV), while Rajagopal's
  # Clavicle markers are only ~2.5 cm off the jugular notch — that mismatch
  # produced ~27 cm IK errors and pulled the torso into hip flexion.
  LSHO: L.Shoulder
  RSHO: R.Shoulder
  CLAV: MidClavicle

  # Arms (wrists averaged below from WRA+WRB)
  LELB: L.Elbow
  RELB: R.Elbow

  # Thigh / knee
  LTHI: L.TH1
  RTHI: R.TH1
  LKNE: L.Knee
  RKNE: R.Knee

  # Shank / ankle
  LTIB: L.SH1
  RTIB: R.SH1
  LANK: L.Ankle
  RANK: R.Ankle

  # Foot
  LHEE: L.Heel
  RHEE: R.Heel
  LTOE: L.Toe
  RTOE: R.Toe

# Multi-source experimental markers → one OpenSim marker (nanmean over frames).
average_markers:
  Head:
    sources: [LFHD, RFHD]
  L.Wrist:
    sources: [LWRA, LWRB]
  R.Wrist:
    sources: [RWRA, RWRB]
  # Sacral marker surrogate when SACR is missing from the C3D.
  S2:
    sources: [LPSI, RPSI]
