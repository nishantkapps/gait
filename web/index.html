<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gait — trial to OpenSim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="top">
    <p class="brand">gait</p>
  </header>

  <main class="stage">
    <h1 class="headline">Turn a capture file into OpenSim outputs</h1>
    <p class="lede">
      Drop a trial file (CSV, C3D, or other), set subject details, and run Workstream A
      on your local server. Download a zip of OpenSim-ready outputs when it finishes.
    </p>

    <form id="job-form" class="panel">
      <label class="drop" id="drop-zone">
        <input type="file" id="source-file" required />
        <span id="drop-label">Drop a file here or click to choose</span>
      </label>

      <div class="grid">
        <label>Subject ID
          <input name="subject_id" id="subject_id" value="SUBJECT01" required />
        </label>
        <label>Mass (kg)
          <input name="mass_kg" id="mass_kg" type="number" step="0.1" value="70" required />
        </label>
        <label>Height (m)
          <input name="height_m" id="height_m" type="number" step="0.01" value="1.70" />
        </label>
        <label>Trial ID
          <input name="trial_id" id="trial_id" value="walk01" />
        </label>
      </div>

      <button type="submit" id="run-btn">Run pipeline</button>
      <p id="status" class="status" role="status"></p>
      <p id="download" class="download" hidden></p>
    </form>
  </main>

  <footer class="foot">
    <span>Workstream A · local server · config-driven</span>
  </footer>
  <script src="app.js" type="module"></script>
</body>
</html>
