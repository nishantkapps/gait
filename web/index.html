<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gait — subject folder to OpenSim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="top">
    <p class="brand">gait</p>
  </header>

  <main class="stage">
    <h1 class="headline">Upload a patient folder into OpenSim outputs</h1>
    <p class="lede">
      Choose the subject directory (Cal static + BWA walk C3Ds). The local server
      scales once, then runs IK/ID for every walk trial and returns a zip.
    </p>

    <form id="job-form" class="panel">
      <label class="drop" id="drop-zone">
        <input type="file" id="folder-input" webkitdirectory directory multiple required />
        <span id="drop-label">Choose patient folder</span>
      </label>

      <div class="grid">
        <label>Subject ID
          <input name="subject_id" id="subject_id" value="TVC-4" required />
        </label>
        <label>Mass (kg) — optional; overridden from C3D PROCESSING if present
          <input name="mass_kg" id="mass_kg" type="number" step="0.1" value="70" />
        </label>
        <label>Height (m) — optional; overridden from C3D PROCESSING if present
          <input name="height_m" id="height_m" type="number" step="0.01" value="1.70" />
        </label>
      </div>

      <button type="submit" id="run-btn">Run pipeline</button>
      <p id="status" class="status" role="status"></p>
      <p id="download" class="download" hidden></p>
    </form>
  </main>

  <footer class="foot">
    <span>Workstream A · local server · folder upload</span>
  </footer>
  <script src="app.js" type="module"></script>
</body>
</html>
